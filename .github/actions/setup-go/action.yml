name: Set up Go
description: "Install a Go toolchain (default: current stable) and optionally enable module caching."

inputs:
  go-version:
    description: Go version or version range to install, or empty to use the project default.
    default: ""
  cache:
    description: Whether to enable the setup-go module cache.
    default: "false"
  cache-dependency-path:
    description: Dependency file used for the module cache key.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version || '1.27.x' }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
