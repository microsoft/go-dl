name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-root:
    name: Test root (Go ${{ matrix.go-version || 'default' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.18.x"
          - ""

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ matrix.go-version }}
          # No cache or cache-dependency-path: root module has no dependencies.

      - name: Test
        env:
          GO_DL_LIVE_TEST: "1"
        run: go test ./...

  test-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-go
        with:
          cache: "true"
          cache-dependency-path: internal/gen/go.sum

      - name: Test
        working-directory: internal/gen
        run: go test ./...
